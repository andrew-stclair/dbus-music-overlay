[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbus-music-overlay"
version = "0.1.0"
description = "A Browser-based Music Overlay for OBS Studio using D-Bus MPRIS data."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Antigravity"}
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "dbus-next>=0.2.3",
    "websockets>=11.0",
]

[project.scripts]
dbus-music-overlay = "dbus_music_overlay.main:start_server"
